server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Buffer sizes for large headers/cookies on localhost
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    # NOTE: Do not set X-Frame-Options globally because /widget must be embeddable in third-party sites.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # CSP: 'wasm-unsafe-eval' is required by FFmpeg WASM (self-hosted under /ffmpeg/).
    # 'worker-src blob:' allows the FFmpeg core worker; 'connect-src' is permissive for
    # backend/CDN-less deploys — tighten per environment if needed.
    # script-src allows the Facebook SDK (WhatsApp Cloud / Facebook / Instagram Embedded
    # Signup) and Google Tag Manager (GA4) — both load external scripts that would
    # otherwise be blocked. 'blob:' is required by FFmpeg WASM which loads its worker
    # as a Blob URL; connect-src 'blob:' is required so the audio recorder can fetch
    # the recorded blob before transcoding to OGG/Opus.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' blob: https://connect.facebook.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' blob: https: wss: ws:; frame-src 'self' https://*.facebook.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # Widget route must be embeddable in customer websites (iframe).
    location = /widget {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /widget/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Reverse proxy para evolution-go — permite que o browser acesse via
    # http://localhost:5173/evo-go/ sem problemas de mixed-content ou CORS.
    # O backend Rails usa http://evo-go-gateway:8080 diretamente (mesma rede Docker).
    location ^~ /evo-go/ {
        proxy_pass http://evo-go-gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
